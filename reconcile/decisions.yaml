# Newly-found candidates, written here by reconcile_audit.py --
# nothing to hand-copy out of its report. Work through these (edit
# canonical_name, set status: confirmed/audited) and run
# `python3 reconcile.py --promote` -- see "THE REVIEW WORKFLOW" up top.
# Empty until reconcile_audit.py has been run at least once.

