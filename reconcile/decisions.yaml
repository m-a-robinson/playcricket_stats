# reconcile/decisions.yaml
#
# The single, human-curated record of every cross-source reconciliation
# decision made for this database: players, clubs, teams, and grounds
# that are the same real thing split across canonical rows, plus club
# home grounds and the vague-venue overrides those enable.
#
# This file IS the decision -- reconcile.py applies it exactly as
# written, nothing more. Candidates are found by reconcile_audit.py,
# which never writes to the database but DOES write here: every run
# appends anything new it finds into `pending:` below, each with a
# suggested `canonical_name` and `status: pending` -- nothing to
# hand-copy out of the Markdown report any more.
#
# THE REVIEW WORKFLOW
# --------------------
# 1. Run reconcile_audit.py. New candidates land in `pending:`, grouped
#    the same way as the real sections (pending: players:, pending:
#    clubs:, ...). Re-running it again later only adds genuinely new
#    candidates -- it never touches canonical_name/status on a pending:
#    entry you've already started editing, and a cluster that grows a
#    new ref (a third spelling surfaces) gets that ref merged into the
#    existing entry rather than creating a duplicate.
# 2. Work through `pending:` at your own pace: correct `canonical_name`
#    (the suggestion is a starting guess, not a fact -- reconcile_audit.py
#    has no way to know East Lancs Paper Mill CC's ground is actually
#    called "Croft Lane", for instance), and set `status: confirmed`
#    (or `audited`) on each you agree with. Leave `status: pending` on
#    anything you haven't decided yet -- it's safe to leave for as long
#    as you like.
# 3. When you're done with the current batch, run
#    `python3 reconcile.py --promote`. This drains `pending:` entirely:
#    every `confirmed`/`audited` entry moves up into the real merge
#    section below (players:/clubs:/teams:/grounds:) -- a decision, from
#    here on applied like any other entry in this file; everything else
#    (still `pending`, or explicitly `rejected`) moves down into
#    `rejected:` instead, so it's remembered without being lost, and
#    reconcile_audit.py won't suggest it again as if it were new. Only
#    run --promote once you've actually finished a review pass --
#    anything still untouched at `status: pending` when it runs falls
#    into `rejected:` (as `status: pending` there) the same as something
#    you looked at and weren't sure about.
# 4. Run `python3 reconcile.py --sqlite-db <path>` to actually apply
#    whatever --promote just confirmed.
#
# HOW TO EDIT THIS FILE
# ----------------------
# - A merge entry (players/clubs/teams/grounds) says "these refs are
#   the same real thing" and gives it a `canonical_name` that's yours to
#   write, promoted from `pending:` or added directly. Editing
#   `canonical_name` on an existing entry and re-running reconcile.py
#   renames the survivor everywhere.
# - Every ref carries a `name` alongside its `source`/`id` -- the row's
#   display name at that source when the ref was written, so a ref
#   reads as something you can actually check ("crichq_pdf: MP
#   Partington") instead of a bare, opaque id. Purely informational --
#   reconcile.py's merge logic only ever reads `source`/`id` -- so it's
#   safe to leave stale if the underlying row is later renamed.
# - A ref should appear in exactly ONE place in this whole file -- one
#   merge entry, or one rejected: entry, or one pending: entry, never
#   two. reconcile_audit.py's rejected:/pending: suppression matches
#   candidates by shared ref, so the same ref sitting in two places
#   (e.g. a rejected: entry that also lists a ref a confirmed merge
#   elsewhere already owns) can wrongly suppress a real future
#   candidate -- this happened for real, see the rejected Ian Wade
#   entry's own reason: below. `python3 reconcile.py --check` finds
#   any such conflict; apply/--promote already run it automatically and
#   refuse to proceed if one exists.
# - A `pending:` entry can carry a `note:` -- written automatically by
#   reconcile_audit.py, never by hand -- when its suggested
#   canonical_name matches a name already confirmed elsewhere in this
#   file even though the two share no refs. Promoting it as-is via
#   --promote would then create a second, disconnected entity with the
#   same name rather than extending the one that already exists -- check
#   whether the refs actually belong in that existing confirmed entry
#   instead before setting status: confirmed.
# - `club_home_grounds` records a club's own ground -- a fact, not a
#   merge -- which `ground_overrides` then uses to fix a source whose
#   own per-match venue text is too vague to be useful (see the CricHQ
#   example below). Neither is auto-populated into `pending:` -- write
#   these directly, they need more context than a candidate cluster
#   alone can suggest.
# - `rejected:` entries can also be added directly, not only via
#   --promote -- e.g. a candidate you're confident is wrong the moment
#   you see it, with `status: rejected` and your reasoning in `reason:`.
# - Changing your mind later: edit or delete the entry here, then
#   rebuild the .sqlite from scratch (delete it, re-ingest every
#   source, re-run reconcile.py). A merge deletes rows in the database,
#   so there's no separate "undo" -- this file is the thing you edit;
#   the database is always just its current output. This is the same
#   rebuild story the rest of the project already follows (see the
#   README's "If in doubt: everything here is safely rebuildable").
# - Re-running `python3 reconcile.py --sqlite-db <path>` is always
#   idempotent -- safe to run again after every ingest, whether or not
#   this file changed.

players:

  - canonical_name: "Ian Wade"
    decided: 2026-08-26
    refs:
      - {source: play_cricket, id: "6216362", name: "Ian Wade"}
      - {source: crichq_pdf, id: "I Wade", name: "I Wade"}
      - {source: cricketstatz, id: "4", name: "I Wade"}
      - source: crichq_pdf
        id: IW wade
        name: IW wade
      - source: crichq_pdf
        id: Ian Wade
        name: Ian Wade
    reason: >
      Confirmed the same player across all three sources by season
      overlap and playing career shape (see README roadmap item 4).
      NOT included: crichq_pdf "I Wade/MR Robinson" -- that ref only
      ever appears as a joint run-out fielder credit, which
      crichq_pdf.py keeps as one combined name (the schema has only one
      fielder_player_id slot per dismissal) -- merging it in would
      wrongly also attribute MR Robinson's share of that run-out to
      Wade. Left out; slightly undercounts his run-out assists by one,
      which is a smaller, more honest error than misattributing a
      joint credit.

